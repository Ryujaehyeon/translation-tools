name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 패키지 설치
        run: pip install -r tools/requirements.txt

      - name: 문법 오류 검사 (py_compile)
        run: python -m py_compile tools/*.py

      - name: 모든 툴 import 확인
        run: |
          cd tools
          python -c "
          import tool_config
          import export_localisation
          import extract_localisation_keys
          import validate_translation_outputs
          import translate_keys
          import run_pipeline
          print('All imports OK')
          "

      - name: run_pipeline 파싱 확인 (--help)
        run: python tools/run_pipeline.py --help > /dev/null
