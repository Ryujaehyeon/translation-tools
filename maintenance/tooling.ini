[paths]
translation_keys = maintenance/translation_keys
workshop_root = D:\Program Files (x86)\Steam\steamapps\workshop\content\281990

[translation]
workers = 3
; TPM 한도 (분당 토큰). 기본 100,000은 Anthropic 무료 티어 기준 (안전한 하한).
; OpenAI Tier 2: 2,000,000 / Anthropic 유료: 400,000 ~ 필요 시 올릴 것.
tpm_limit = 100000

[output]
# 출력 모드: integrated = 통합팩 하나로, standalone = 모드별 개별 폴더 (기본값)
# 이 항목을 삭제하거나 비워두면 standalone으로 동작
mode = integrated
